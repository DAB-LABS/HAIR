[project]
name = "hair"
version = "0.9.6"
description = "HAIR - Home Assistant IR Device Manager"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "David Bailey", email = "david.a.bailey@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    # PyYAML and voluptuous ship with Home Assistant at runtime (no manifest
    # pin). They are declared here so CI, which does not install Home
    # Assistant, gets the real packages: the pluckable registry loader imports
    # yaml and builds a real voluptuous schema (PREVENT_EXTRA, All, Range, In,
    # Invalid) that the conftest voluptuous fallback stub does not provide.
    # With both installed, conftest's `import voluptuous` succeeds and the real
    # package is used, matching the Home Assistant runtime.
    "pyyaml>=6.0",
    "voluptuous>=0.13",
    # cryptography ships with Home Assistant core at runtime (auth, TLS).
    # Declared here so CI, which does not install HA, can exercise the
    # real ed25519 fitting-signature path (fitting_signing.py). The code
    # degrades to unsigned fittings when the import fails, so this pin
    # gates test coverage, not runtime correctness.
    "cryptography>=42.0",
    # At runtime HAIR uses the infrared-protocols version its Home Assistant
    # release pins in the `infrared` component; the manifest declares none.
    # This is a floor only, so pip can resolve. CI installs each supported
    # release's exact pin through ci/constraints/ (see the README there).
    "infrared-protocols>=5.6.1",
]
lint = [
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["custom_components/hair/tests"]
asyncio_mode = "auto"
markers = [
    "real_air: the real-air harness (minutes). Deselect locally with -m 'not real_air'; CI runs it, and a CI run that selects none of it fails.",
]

[tool.ruff]
target-version = "py313"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
