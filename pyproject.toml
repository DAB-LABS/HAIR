[project]
name = "hair"
version = "0.9.6"
description = "HAIR - Home Assistant IR Device Manager"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "David Bailey", email = "david.a.bailey@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # PyYAML and voluptuous ship with Home Assistant at runtime (no manifest
    # pin). They are declared here so CI, which does not install Home
    # Assistant, gets the real packages: the pluckable registry loader imports
    # yaml and builds a real voluptuous schema (PREVENT_EXTRA, All, Range, In,
    # Invalid) that the conftest voluptuous fallback stub does not provide.
    # With both installed, conftest's `import voluptuous` succeeds and the real
    # package is used, matching the Home Assistant runtime.
    "pyyaml>=6.0",
    "voluptuous>=0.13",
    # cryptography ships with Home Assistant core at runtime (auth, TLS).
    # Declared here so CI, which does not install HA, can exercise the
    # real ed25519 fitting-signature path (fitting_signing.py). The code
    # degrades to unsigned fittings when the import fails, so this pin
    # gates test coverage, not runtime correctness.
    "cryptography>=42.0",
    # Runtime consumes infrared-protocols via HA core's `infrared` dependency
    # (no manifest pin). It is declared here only so the test suite can
    # exercise the real NEC decoder. Version policy: cover the library line
    # shipped across HAIR's supported HA window, which is the current HA
    # release back through roughly four monthly releases (floor: HA 2026.4,
    # matching hacs.json). HA 2026.6 shipped 5.6.1 and HA 2026.7 ships
    # 6.3.0; the 6.x line is verified compatible on live HA 2026.7 hardware
    # (decode paths in protocol_decode.py are defensively guarded either
    # way). PyPI currently publishes through 5.8.1, so CI installs the
    # newest 5.x today and picks up 6.x automatically once it is published.
    # Upstream moved to 7.x in 2026-07 and is on 9.1.0 as of 2026-09;
    # the commands.Command contract is unchanged from 5.x, so the cap
    # tracks the next major. Verified for the 9.1.0 bump by reading the
    # sources rather than the release notes: commands/__init__.py, which
    # defines the base Command every registered class derives from, is
    # BYTE-IDENTICAL across 5.8.1, 8.2.1 and 9.1.0; from_raw_timings is
    # still callable positionally everywhere protocol_decode calls it
    # (NEC gained a keyword-only decode_subfunction defaulting to False,
    # which is compatible); and Kaseikyo widened data from bytes to
    # bytes | list[bytes] additively, preserving the single-frame path,
    # on a class HAIR resolves locally anyway.
    #
    # TWO THINGS THE CAP CANNOT EXPRESS, both worth knowing before
    # trusting it (0.14.1 A3):
    #
    # 1. From 6.0.0 upstream requires Python >= 3.14. On 3.13, which is
    #    this project's floor and one of the two CI legs, pip resolves
    #    5.8.1 no matter what this cap says. The pin is therefore NOT
    #    unconditional, as this comment used to claim; it is a ceiling
    #    that only the 3.14 leg can reach.
    # 2. Because of (1) the two CI legs can resolve different majors,
    #    and the majors differ in what they DECODE:
    #    general_electric.GEACCommand gains from_raw_timings in 8.x, and
    #    protocol_decode registers exactly that module and class name by
    #    feature detection, so GEAC joins the probe order on 3.14 and
    #    stays absent on 3.13. An environment marker would keep the legs
    #    identical if that divergence is not wanted.
    "infrared-protocols>=5.6,<10.0",
]
lint = [
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["custom_components/hair/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
