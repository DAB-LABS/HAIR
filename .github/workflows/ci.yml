name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # One leg per supported Home Assistant release, each with the exact
    # infrared-protocols version that release pins and the Python it
    # requires. See ci/constraints/README.md.
    name: test (HA ${{ matrix.ha }}, ${{ matrix.leg }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.leg == 'next' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: floor
            ha: "2026.6"
            python-version: "3.14"
          - leg: current
            ha: "2026.11"
            python-version: "3.14"
          - leg: next
            ha: "next"
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ci/constraints/ha-${{ matrix.ha }}.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" -c ci/constraints/ha-${{ matrix.ha }}.txt
          python -c "import importlib.metadata as m; print('infrared-protocols', m.version('infrared-protocols'))"

      - name: Run tests
        run: pytest --tb=short -q -n auto --durations=15

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[lint]"

      - name: Ruff check
        run: ruff check .

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
