schema_version: "0.6"
protocol_id: DAIKIN152
aliases:
  - "Daikin ARC-series, 5-bit leader plus two 64-bit frames plus a 152-bit frame"
  - "the largest single-signature Daikin cluster in the corpus"
status: draft

frame:
  total_bits: 152
  # FOUR frames, not three, and the leader block is one of them.
  #
  # The note this line used to carry ("plus a 5-bit leader block that
  # carries no bytes") was right about the data and wrong about the
  # reader. The schema's decision procedure treats a pair as a header
  # only when its mark AND space fall inside header_mark_us and
  # header_space_us; the leader block's pair is about 421/421, which is
  # in neither, so the reader classifies it as bits and its 25 ms gap
  # closes a frame. Four frames then met a three-frame layout and
  # identification failed on every code in this family, including the
  # files named in derivation.files_used below. The census measured it
  # at 0 of 2,955. Declaring the block is the fix, and bits_tolerance 1
  # covers the codes that render it as four pairs rather than five.
  frames_per_command: 4
  frame_layout: [5, 64, 64, 152]
  payload_frame: 3
  setting_frames: [3]
  # Schema v0.6. The leader block may be absent. Handset captures carry
  # it (every decodable code in the eight derivation files does), but
  # an encoder may send the three frames alone, and a lattice rendered
  # that way (GH #183) read as nothing at all. When it is missing the
  # reader lays the other three frames on indices 1..3, so every index
  # in this file names the same frame either way. The leader carries no
  # byte and nothing here reads it, which is what lets it be optional.
  optional_leader: true
  modulation: pulse_distance
  bit_order: lsb_first
  header_us: [3448, 1740]
  bit0_us: {mark: 427, space: 458}
  bit1_us: {mark: 427, space: 1312}
  carrier_hz: null
  bits_tolerance: 1
  header_tolerance_us: 700
  timing:                      # measured across every cell of every file in the family
    classify: space            # the space of each mark/space pair carries the bit
    unit_mark_us:    {nominal: 427, min: 171, max: 998}
    space_zero_us:   {nominal: 458, min: 199, max: 819}
    space_one_us:    {nominal: 1312, min: 820, max: 1860}
    header_mark_us:  {nominal: 3448, min: 2244, max: 5390}
    header_space_us: {nominal: 1740, min: 1111, max: 2766}
    frame_gap_us:    {min: 2000}
  identity_bytes: [[3, 0, 0x11], [3, 1, 0xDA], [3, 2, 0x27]]

integrity:
  - type: checksum_sum
    description: "Frame 2's last byte (18) is the sum of bytes 0..17, mod 256."
    params: {frame: 3, range: [0, 17], target_byte: 18, mod: 256, offset: 0}
    verified_on: "9153/9153 checks across 8 files, all three rules together (every file 100%)"
    confidence: ratified
  - type: checksum_sum
    description: "The same rule holds on frame 0 (byte 7 = sum of bytes 0..6)."
    params: {frame: 1, range: [0, 6], target_byte: 7, mod: 256, offset: 0}
    verified_on: "3051/3051 cells across 8 files"
    confidence: ratified
  - type: checksum_sum
    description: "And on frame 1 (byte 7 = sum of bytes 0..6)."
    params: {frame: 2, range: [0, 6], target_byte: 7, mod: 256, offset: 0}
    verified_on: "3051/3051 cells across 8 files"
    confidence: ratified

fields:
  - name: temperature
    frame: 3
    byte: 6
    bits: full_byte
    encoding: "T * 2, so the field carries half-degree resolution even where labels do not."
    encoding_ref:
      name: offset_linear
      params: {scale: 2, offset: 0, round: nearest}
    applies_when:
      not_in: {mode: [dry, fan_only]}
    confidence: provisional
    domain: "T in 18..32 C; the unit clamps below 18 C (see disagreeing files)"
    vocabulary: {}
    agreement:
      pass: 1691
      checked: 1828
      rate: "92.51%"
      files_at_100: "4/8"
      disagreeing_files:
        - "3101.json (Daikin, litinoveweedle only): cool 91/147. Cells labelled 10-17 C
           all transmit 0x24 (18 C), which reads as the unit clamping at its minimum
           rather than as a decode failure. Real, and exactly the class of thing the
           sweep should surface."
        - "1101.json: cool 92/104, heat 91/104, heat_cool 92/104, a thin run of cells
           at 18-21 C transmitting 25 C or 30 C"
        - "1108.json: auto and heat lose 8 cells each at 31-32 C"
        - "1114.json: 9 cells spread across heat and heat_cool"

  - name: mode
    frame: 3
    byte: 5
    bits: "mask:0x70"
    encoding: "3-bit enum at frame 2 byte 5 bits 4-6."
    encoding_ref:
      name: enum_nibble
      params:
        vocabulary: {auto: 0x0, heat_cool: 0x0, dry: 0x2, cool: 0x3, heat: 0x4, fan_only: 0x6}
    confidence: ratified
    vocabulary: {auto: 0x0, heat_cool: 0x0, dry: 0x2, cool: 0x3, heat: 0x4, fan_only: 0x6}
    mode_traits:
      cool: {temp: varies, fan: free}
      heat: {temp: varies, fan: free}
      heat_cool: {temp: varies, fan: free}
      auto: {temp: varies, fan: free}
      dry: {temp: invariant, fan: forced, sentinel: 0xC0}
      # fan_only carries the labelled speed. Every source that has the mode
      # says so: in 1101, 1104, 1106, 1108, 1114 and 3101 each fan_only
      # column reads its own label (auto 0xA, levels 0x3..0x7,
      # night/nature/breeze 0xB), with no fan_speed mismatch in any of
      # them, and so does the GH #183 wig. Only dry pins the fan to auto.
      fan_only: {temp: invariant, fan: free, sentinel: 0x32}
    agreement:
      pass: 3029
      checked: 3043
      rate: "99.54%"
      files_at_100: "7/8"
      disagreeing_files:
        - "1108.json: 15 heat cells read 0x3 (cool)"

  - name: fan_speed
    frame: 3
    byte: 8
    bits: high_nibble
    encoding: "4-bit enum at frame 2 byte 8 bits 4-7."
    encoding_ref:
      name: enum_nibble
      params:
        vocabulary: {low: 0x3, level1: 0x3, "1": 0x3,
                     lowMedium: 0x4, level2: 0x4, "2": 0x4,
                     medium: 0x5, level3: 0x5, "3": 0x5,
                     mediumHigh: 0x6, level4: 0x6, "4": 0x6,
                     high: 0x7, level5: 0x7, "5": 0x7,
                     auto: 0xA,
                     breeze: 0xB, nature: 0xB, night: 0xB, quiet: 0xB}
    applies_when:
      not_in: {mode: [dry]}
    confidence: ratified
    vocabulary: {low: 0x3, level1: 0x3, "1": 0x3, lowMedium: 0x4, level2: 0x4, "2": 0x4,
                 medium: 0x5, level3: 0x5, "3": 0x5, mediumHigh: 0x6, level4: 0x6,
                 "4": 0x6, high: 0x7, level5: 0x7, "5": 0x7, auto: 0xA,
                 breeze: 0xB, nature: 0xB, night: 0xB, quiet: 0xB}
    vocabulary_notes:
      - "dry pins the field to 0xA regardless of the labelled speed. fan_only does
         not: it carries the labelled speed like the heating and cooling modes."
      - "0x7 is the highest of the five fixed levels. Every source that labels it
         agrees: high in 1101, 1106, 1114 and 3101, level5 in 1104 and 1108, and 5 in
         1118, with no file reading 0x7 under any other label. The committed ARC486A1
         handset capture (tests/fixtures/field-captures/arc486a1-orthobot.pronto)
         carries 0x7 in cool at 24 C with vertical swing on, so it reads as high."
      - "powerful is NOT a fan speed and is no longer in this vocabulary. It is its
         own flag (see the powerful field), and the fan nibble in a powerful cell is
         whatever speed was set: 0xA in 1101 and 1108, 0x7 in 1114 and in the GH
         #183 wig. Mapping powerful to 0xA was what made 1114's 39 powerful cells and
         the #183 wig's 84 cool/powerful cells read as fan mismatches."
      - "quiet reads 0xB, the same rung as night, nature and breeze, in the #183 wig
         (every quiet cell, in every mode that carries a speed)."
    agreement:
      pass: 1789
      checked: 1828
      rate: "97.87% (dry and fan_only excluded as forced)"
      files_at_100: "7/8"
      disagreeing_files:
        - "1114.json: 39 'powerful' cells read 0x7 (high) instead of 0xA. Resolved by
           reading powerful as its own flag; see vocabulary_notes. These figures are
           the original derivation's; the traits round's own measurement is in
           derivation.notes."

  - name: powerful
    frame: 3
    byte: 13
    bits: "bit:0"
    coordinate: fan
    encoding: "1 = the powerful label, 0 = any other labelled speed."
    encoding_ref:
      name: bitflag
      params: {true_values: [powerful]}
    confidence: ratified
    vocabulary: {powerful: 0x1}
    agreement:
      pass: 3001
      checked: 3014
      rate: "99.57% across the eight derivation files; 2016/2016 on the GH #183 wig"
      files_at_100: "7/8"
      disagreeing_files:
        - "1114.json: its 13 fan_only/powerful cells are byte-for-byte copies of its
           fan_only/high cells (13/13 identical settings frames), while its cool and
           heat powerful cells carry the flag. The file filed its high press under
           powerful in that one mode, the same kind of upstream defect as 1108.json's
           heat column, and the finding on those cells is true."
    vocabulary_notes:
      - "A flag, not a fan rung, the same shape as TCL112's quiet flag. The wig files
         put powerful on the fan axis, so the flag answers that coordinate: 1 when the
         label is powerful, 0 for every other label."

  - name: economy
    frame: 3
    byte: 16
    bits: "bit:2"
    coordinate: fan
    encoding: "1 = the economy label, 0 = any other labelled speed."
    encoding_ref:
      name: bitflag
      params: {true_values: [economy, eco, econo]}
    confidence: provisional
    vocabulary: {economy: 0x1}
    vocabulary_notes:
      - "One source only: the GH #183 wig, which looks rendered by an encoder rather
         than captured. No SmartIR file in this family carries an economy label, and
         the bit is clear in every one of their cells. Provisional until a handset
         capture with economy on and off is on file."

  - name: sleep
    frame: 3
    byte: 13
    bits: "bit:2"
    coordinate: fan
    encoding: "1 = the sleep label, 0 = any other labelled speed."
    encoding_ref:
      name: bitflag
      params: {true_values: [sleep]}
    confidence: provisional
    vocabulary: {sleep: 0x1}
    vocabulary_notes:
      - "One source only, the GH #183 wig: its sleep cells carry fan 0x7 and this bit,
         and differ from its powerful and economy cells only in which of the three flags
         is set. The bit is clear in every SmartIR cell of this family. Provisional
         until a handset capture with sleep on and off is on file."

  - name: swing_vertical
    frame: 3
    byte: 8
    bits: low_nibble
    # Two fields answer one wig coordinate, so both name it (schema v0.3),
    # as DAIKIN216 does for the same two nibbles.
    coordinate: swing
    encoding: "0xF when the vertical vane is swinging, 0x0 when it is parked."
    encoding_ref:
      name: enum_nibble
      params:
        vocabulary: {"off": 0x0, vertical: 0xF, horizontal: 0x0, both: 0xF}
    confidence: provisional
    vocabulary: {"off": 0x0, vertical: 0xF, horizontal: 0x0, both: 0xF}
    vocabulary_notes:
      - "Located on one varying source, the GH #183 wig (504/504 cells per label).
         The SmartIR files do not vary it by label (0x0 in 1101, 1104, 1114, 1118 and
         3101, 0xF in 1106, and 0xF in 1108 apart from 15 of its 579 cells), which
         agrees with the nibble but cannot ratify it. The committed ARC486A1 handset capture reads 0xF with vertical
         swing on: one real press on the same point, not a toggled pair. Provisional
         until two handset presses of one state, swing on and off, are on file."

  - name: swing_horizontal
    frame: 3
    byte: 9
    bits: low_nibble
    coordinate: swing
    encoding: "0xF when the horizontal vane is swinging, 0x0 when it is parked."
    encoding_ref:
      name: enum_nibble
      params:
        vocabulary: {"off": 0x0, vertical: 0x0, horizontal: 0xF, both: 0xF}
    confidence: provisional
    vocabulary: {"off": 0x0, vertical: 0x0, horizontal: 0xF, both: 0xF}
    vocabulary_notes:
      - "Same evidence as swing_vertical: 504/504 in the GH #183 wig, not varied by
         label in any SmartIR file (0x0 in 1101, 1104, 1106, 1114 and 1118, 0xF in
         3101, and 0xF in 1108 apart from the same 15 cells), 0x0 in the handset
         capture. Provisional for the same reason."

  - name: power
    frame: 3
    byte: 5
    bits: "bit:0"
    encoding: "1 = on. The off command clears it."
    encoding_ref:
      name: bitflag
      params: {true_values: ["on"]}
    confidence: provisional
    vocabulary: {"on": 0x1, "off": 0x0}
    agreement:
      pass: null
      checked: null
      pass: 2724
      checked: 3043
      rate: "89.52% -- every off code has the bit clear, but state cells are not
             uniformly 1, so the bit is not purely a power flag"
      files_at_100: "4/8"
      disagreeing_files:
        - "1104.json (210 state cells), 1106.json (4), 1108.json (1)"

synthesis:
  # Four frames now, the first being the leader block. It is five zero
  # bits in every code of the family, and tail_bits says so because five
  # is not a whole byte.
  template: [[0x00],
             [0x11, 0xDA, 0x27, 0x00, 0xC5, 0x00, 0x00, 0x00],
             [0x11, 0xDA, 0x27, 0x00, 0x42, 0x00, 0x10, 0x00],
             [0x11, 0xDA, 0x27, 0x00, 0x00, 0x01, 0x32, 0x00, 0xA0, 0x00, 0x00, 0x06,
              0x60, 0x00, 0x00, 0xC1, 0x00, 0x00, 0x00]]
  tail_bits: {0: "00000"}
  fixture_coordinates:
    mode: [cool, heat, heat_cool]
    fan: [auto, low, medium, high]
    temp: [18, 22, 25, 28, 30]

derivation:
  files_used:
    - {repo: smartHomeHub, file: "1101, 1104, 1106, 1108, 1114, 1118", manufacturer: Daikin, models: [many FTXS/FTXM series]}
    - {repo: litinoveweedle, file: "1118, 3101", manufacturer: Daikin, models: [many]}
    # Traits round only, as corroboration; nothing is ratified on these alone.
    - {source: "GH #183 reporter's wig, converted from SmartIR (ESPHome native Daikin, ARC43XXX-compatible)", note: "rendered, not captured; the only source that varies swing, economy and sleep"}
    - {source: "tests/fixtures/field-captures/arc486a1-orthobot.pronto", note: "one ARC486A1 handset press: cool, 24 C, fan 0x7, vertical swing on"}
  external_sources:
    - "None. The blafois write-up named in the first brief was not fetched by either
       pass; nothing here needs it."
  open_questions:
    - "The 5-bit leader block that precedes the three frames carries no whole byte and
       is not decoded. It is stable across every cell."
    - "Frame 1 is constant per file and satisfies its own checksum; what it carries is
       not derived. Family-wide only its byte 5 moves, between 0x00 and 0x10."
    - "Frame 2 bytes 5 and 6 are a CAPTURE-TIME value, not a setting. Read as one
       16-bit quantity (byte 6 high, byte 5 low) it advances without going backwards
       through 88% to 100% of consecutive cells in each file's own order, while mode,
       fan and temperature change freely around it, and it spans only a few hundred
       counts per file (1104: 329..648, 1106: 1108..1313, 1101: 13172..13524). Two
       files, 1114.json and 3101.json, pin it at exactly 0x1000 for all 517 and 460
       cells, which is the shape of a clock that was never set. Byte 7 is its checksum
       and tracks it. Nothing in this frame answers a wig dimension, and a field must
       not be derived from it: the value records when the capture was taken."
    - "Swing is located but provisional: frame 3 byte 8 low nibble (vertical) and byte 9
       low nibble (horizontal), the same two nibbles DAIKIN216 ratified from its own
       wig. No SmartIR file in this sub-cluster declares a swing dimension; the only
       source that varies it is the GH #183 wig. What would ratify it: two handset
       presses of one state, swing on and off."
    - "economy (frame 3 byte 16 bit 2) and sleep (frame 3 byte 13 bit 2) have the same
       standing: one rendered source, read but not judged."
    - "The power bit at frame 2 byte 5 bit 0 is not clean (see the field). It is more
       likely a combined power-plus-something flag."
  notes:
    - "Traits round (GH #183), measured with the comb over the eight derivation files and
       the #183 wig. fan_speed: 1814 checked with 39 mismatches before (all 1114
       powerful), 2306 checked with 0 after, the rise being fan_only, now judged. On the
       wig: 420 checked with 84 mismatches before (every cool/powerful cell), 840 with 0
       after. powerful: 3014 checked with 13 mismatches (the 1114 fan_only duplicates
       described on the field), 2016 with 0 on the wig. The wig's four fan-0x7 labels
       (high, powerful, economy, sleep) differ from each other only in the three flag
       bits, so reading all three, plus the two swing nibbles, is what gives each of its
       2016 states a reading of its own: 736 distinct readings where 115 were before,
       and no two labels sharing one."
    - "The first pass reported Daikin as spread across at least 6 frame signatures and
       reached none of them. That spread is real and is tabulated in the round-two
       report; this is the largest single one, 13 rows / 8 distinct files, and it is
       pure Daikin with no rebadges."
    - "The three-way checksum result makes this family fully integrity-checkable even
       where a field is unreadable, which is worth as much to release two as the fields are."
    - "setting_frames is [3], and the measurement behind that is worth keeping. A report
       reached this map claiming mode is carried outside frame 3, on the evidence that
       1108.json's cool and heat cells at level5 differ ONLY in frame 2. Both halves of
       that observation are true and the conclusion does not follow. Across the family,
       mode pairs holding fan, swing and temperature fixed differ in frames 2 and 3
       together 6,694 times, in frame 3 alone 2,589 times, and in frame 2 alone 28
       times. All 28 are the same 14 coordinates in the two repo copies of 1108.json,
       and the bytes that differ are 5 and 7, the capture clock and its checksum."
    - "What those 28 cells actually are is an upstream defect in 1108.json. Its
       heat/level5 column ships a payload frame whose mode nibble reads 0x30, cool.
       Every other (mode, fan) column of that file reads the mode its own label claims,
       and the control file 1101.json is clean across all 40 columns. So the comb's
       finding on those cells is TRUE and the file is wrong: pressing heat there puts
       the unit into cool. No field and no frame needs to change for it, and mapping
       around it would bury a real defect in a real file."
