schema_version: "0.5"
protocol_id: FUJITSU128
aliases:
  - "Fujitsu AR-series remotes, one 128-bit frame, vendor prefix 14 63 00 10 10 FE 09"
  - "General Electric and Hisense rebadges of the same frame"
status: draft

frame:
  total_bits: 128
  frames_per_command: 1
  frame_layout: [128]
  payload_frame: 0
  setting_frames: [0]
  modulation: pulse_distance
  bit_order: lsb_first
  header_us: [3261, 1604]
  bit0_us: {mark: 421, space: 394}
  bit1_us: {mark: 421, space: 1183}
  carrier_hz: null
  bits_tolerance: 1
  header_tolerance_us: 700
  timing:                      # measured over 1,860,531 pulse pairs, 17 files
    classify: space
    unit_mark_us:    {nominal: 421, min: 180, max: 800}
    space_zero_us:   {nominal: 394, min: 180, max: 860}
    space_one_us:    {nominal: 1183, min: 861, max: 1600}
    header_mark_us:  {nominal: 3261, min: 2600, max: 4000}
    header_space_us: {nominal: 1604, min: 1300, max: 2000}
    # One frame per command, so this only has to sit above the longest
    # bit space (1,600) and below the shortest inter-frame silence
    # measured, 13,832.
    frame_gap_us:    {min: 6000}
  # Seven constant bytes, on every one of the 14,535 codes read. This is
  # the longest identity in the directory and it is what lets a
  # single-frame 128-bit map sit safely beside the other AC families.
  identity_bytes: [[0, 0, 0x14], [0, 1, 0x63], [0, 2, 0x00], [0, 3, 0x10],
                   [0, 4, 0x10], [0, 5, 0xFE], [0, 6, 0x09]]

integrity:
  - type: checksum_sum
    description: "The last byte is 0xD0 minus the sum of bytes 8 to 14,
      mod 256. Note the sign: this frame's check byte falls as its
      payload rises, which is why the rule needs `scale: -1`."
    params: {frame: 0, range: [8, 14], target_byte: 15, mod: 256,
             scale: -1, offset: 0xD0}
    verified_on: "14340/14535 codes across 17 files (98.66%), every file
      but 1289.json at 100%"
    confidence: ratified

fields:
  - name: mode
    frame: 0
    byte: 9
    bits: "[0,3]"
    encoding: "Three bits naming the operating mode."
    encoding_ref:
      name: enum_nibble
      params:
        vocabulary: {auto: 0x0, heat_cool: 0x0, cool: 0x1, dry: 0x2,
                     fan_only: 0x3, heat: 0x4}
    confidence: ratified
    domain: "0x0 through 0x4"
    vocabulary: {auto: 0x0, heat_cool: 0x0, cool: 0x1, dry: 0x2,
                 fan_only: 0x3, heat: 0x4}
    vocabulary_notes:
      - "auto and heat_cool are two SmartIR spellings of 0x0."
    agreement:
      pass: 14535
      checked: 14535
      rate: "100.00%"
      files_at_100: "17/17"
      disagreeing_files: []

  - name: swing
    frame: 0
    byte: 10
    bits: "[3,3]"
    encoding: "Three bits naming which louvre sweeps."
    encoding_ref:
      name: enum_nibble
      params:
        vocabulary: {"off": 0x0, static: 0x0, swing: 0x2, vertical: 0x2,
                     horizontal: 0x4, both: 0x6}
    confidence: ratified
    domain: "0x0, 0x2, 0x4, 0x6"
    vocabulary: {"off": 0x0, static: 0x0, swing: 0x2, vertical: 0x2,
                 horizontal: 0x4, both: 0x6}
    vocabulary_notes:
      - "Only seven of the seventeen files carry a swing axis at all."
      - "The odd values are unused: the field is two independent bits at
         positions 4 and 5, read here as one range because no file in the
         corpus sets bit 3."
    agreement:
      pass: 8378
      checked: 8402
      rate: "99.71%"
      files_at_100: "6/7"
      disagreeing_files:
        - "smartHomeHub/1294.json: 24 cells"

  - name: fan_speed
    frame: 0
    byte: 10
    bits: "[0,3]"
    encoding: "A five-step ordinal scale, 0 for auto then quiet to
      highest. The STEPS are stable across the family; the names files
      give them are not."
    encoding_ref:
      name: enum_nibble
      params:
        vocabulary: {auto: 0x0, highest: 0x1, high: 0x1, med: 0x2,
                     mid: 0x2, medium: 0x2, low: 0x3, quiet: 0x4}
    confidence: provisional
    domain: "0x0 through 0x4"
    vocabulary: {auto: 0x0, highest: 0x1, high: 0x1, med: 0x2,
                 mid: 0x2, medium: 0x2, low: 0x3, quiet: 0x4}
    vocabulary_notes:
      - "Provisional, and the disagreement is about NAMES rather than
         about the field. Some files call the four non-auto steps high,
         med, low, quiet and others highest, high, medium, low, so one
         file's `high` is another's `highest` and the same wire value
         answers to both. Ratifying either reading files findings against
         the other."
      - "A second pattern sits on top of it: several files write 0, the
         auto value, for every fan label they offer, the same flat-column
         shape PANASONIC216 records."
    agreement:
      pass: 12267
      checked: 14535
      rate: "84.40%"
      files_at_100: "4/17"
      disagreeing_files:
        - "thirteen of the seventeen, listed in the derivation report"

synthesis:
  template:
    - [0x14, 0x63, 0x00, 0x10, 0x10, 0xFE, 0x09, 0x30,
       0x21, 0x01, 0x00, 0x00, 0x00, 0x00, 0x20, 0x00]
  tail_bits: {}
  fixture_coordinates:
    mode: [cool, heat, dry, fan_only, auto]
    fan: [auto, high, med, low]
    temp: [18, 20, 22, 24, 26, 28]

