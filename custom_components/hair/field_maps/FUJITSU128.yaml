  external_sources: []
  open_questions:
    - "TEMPERATURE IS NOT MAPPED, and the reason is a real property of
       the frame rather than a gap in the reading. The setpoint lives in
       byte 8's high nibble, which is settled: it steps by one per degree
       in every file. What is not settled is where it starts. The nibble
       counts from the REMOTE'S OWN minimum, not from a fixed
       temperature, so a file whose range opens at 16 C and one whose
       range opens at 18 C both put 0x2 in the nibble for their lowest
       setting. Measured across the family the offset takes at least five
       values, 8,418 cells at +2 and 3,691 at 0. No encoding in the
       closed set can express `T minus this file's minimum`, and guessing
       one offset would file a finding on every cell of every file using
       the other. This wants either a new encoding keyed to the wig's own
       temperature range or a decision that the field stays unchecked."
    - "Power is not mapped. Byte 9 bit 3 is zero on all 14,535 codes, so
       the corpus cannot show it varying, exactly as with PANASONIC216."
    - "Two files render 120 bits rather than 128 and two more render a
       leading empty frame. All four carry the same seven identity bytes
       and are the same family; whether the 120-bit form drops a byte or
       the capture lost one is not answerable from the corpus."
  notes:
    - "Both bench units are in this family, in the single-frame 128-bit
       group carrying the seven-byte prefix. AR-RY4 is
       smartHomeHub/1294.json and AR-RBE1E is 1280.json, present in both
       repositories. 1294.json is also the ONE file whose swing column
       disagrees with the rest of the family, 24 cells of it, so the
       AR-RY4 unit is the one that can settle that field on hardware."
