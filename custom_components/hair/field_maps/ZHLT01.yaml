schema_version: "0.1"
protocol_id: ZHLT01
aliases:
  - ZH/TY-01
  - ZH/TT-02
  - ZH/LT-01
  - "Chigo 96-bit complement-paired family (Akai, Tornado, Zanussi, Tristar, SAGA rebadges)"
status: draft

frame:
  total_bits: 96
  frames_per_command: 1
  frame_layout: [96]
  payload_frame: 0
  modulation: pulse_distance
  bit_order: msb_first
  header_us: [6070, 7400]
  bit0_us: {mark: 580, space: 520}
  bit1_us: {mark: 580, space: 1590}
  carrier_hz: null
  bits_tolerance: 1
  header_tolerance_us: 700
  timing:                      # measured across every cell of every file in the family
    classify: space            # the space of each mark/space pair carries the bit
    unit_mark_us:    {nominal: 549, min: 214, max: 1312}
    space_zero_us:   {nominal: 580, min: 249, max: 1044}
    space_one_us:    {nominal: 1648, min: 1045, max: 2320}
    header_mark_us:  {nominal: 6073, min: 3944, max: 9514}
    header_space_us: {nominal: 7416, min: 4835, max: 11529}
    frame_gap_us:    {min: 2495}
  identity_bytes: [[0, 0, 0xFF], [0, 10, 0x54], [0, 11, 0xAB]]

integrity:
  - type: complement_pairs
    description: >
      96 bits transmit as 12 bytes in six payload/complement pairs:
      byte[2i+1] == (~byte[2i]) & 0xFF for i in 0..5.
    params: {frame: 0, start: 0, count: 6}
    verified_on: "10572/10572 pair checks across 7 files (every file 100%)"
    confidence: ratified

fields:
  - name: temperature
    frame: 0
    byte: 8
    bits: high_nibble
    encoding: "T in 16..31: reverse_bits4(31 - T). T == 32 reuses 0xF and is told apart from T = 16 by byte 4 bit 7."
    encoding_ref:
      name: reverse_bits4_31_minus_t
      params: {special: {32: 0xF}}
    confidence: ratified
    domain: "16..32 C in the modes that carry a setpoint at all (see mode_traits)"
    vocabulary: {}
    agreement:
      pass: 1401
      checked: 1473
      rate: "95.11%"
      files_at_100: "5/7"
      disagreeing_files:
        - "1581.json (Chigo ZH/TY-01): heat_cool 46/68. From T=23 up the cell reads
           the value for T+1, a whole column shifted one degree. Single-degree label
           drift, the exact defect class this library exists to catch."
        - "2760.json (Tristar AC-5400): cool 66/68 (T=21 and T=27 isolated single-cell
           misses) and fan_only 20/68 (partially frozen, see mode_traits)."

  - name: mode
    frame: 0
    byte: 8
    bits: "mask:0x07"
    encoding: "3-bit enum. Bit 3 of the same nibble is a separate setpoint-active flag, not part of mode."
    encoding_ref:
      name: enum_nibble
      params:
        vocabulary: {cool: 0x3, heat: 0x6, dry: 0x5, fan_only: 0x1, heat_cool: 0x7}
    confidence: provisional
    vocabulary: {cool: 0x3, heat: 0x6, dry: 0x5, fan_only: 0x1, heat_cool: 0x7}
    vocabulary_notes:
      - "cool, heat and dry agree in every file that carries them. fan_only and
         heat_cool do NOT: three files put fan_only at 0x1 and heat_cool at 0x7,
         1581.json has them the other way round, and 1580.json codes heat_cool the
         same as heat. The map takes the majority and names the outliers rather than
         picking the file the first pass happened to read."
      - "The first pass's map had fan_only 0xF and heat_cool 0x9, read off 1581.json
         alone; those are the whole nibble including the setpoint-active bit, and they
         are the minority reading."
    mode_traits:
      cool: {temp: varies, fan: free}
      heat: {temp: varies, fan: free}
      dry: {temp: file_dependent, fan: forced}
      fan_only: {temp: file_dependent, fan: free}
      heat_cool: {temp: file_dependent, fan: free}
    agreement:
      pass: 1580
      checked: 1755
      rate: "90.03%"
      files_at_100: "5/7"
      disagreeing_files:
        - "1581.json: fan_only and heat_cool swapped relative to the other files (136 cells)"
        - "1580.json: heat_cool coded 0x6, identical to heat (39 cells)"

  - name: setpoint_active
    frame: 0
    byte: 8
    bits: "bit:3"
    encoding: "1 whenever a real temperature is being set; 0 at T=32 in the modes that carry a setpoint."
    confidence: provisional
    vocabulary: {}
    agreement:
      pass: null
      checked: null
      rate: "consistent in all 7 files; not expressed as a checkable field because its
             coordinate is 'T == 32', which no SmartIR label states directly"
      files_at_100: "7/7 by inspection"
      disagreeing_files: []

  - name: fan_speed
    frame: 0
    byte: 6
    bits: "mask:0x07"
    encoding: "3-bit enum in the low bits of byte 6, sharing the byte with swing and power."
    encoding_ref:
      name: enum_nibble
      params:
        vocabulary: {auto: 0x7, high: 0x3, medium: 0x5, mid: 0x5, low: 0x1}
    applies_when:
      not_in: {mode: [dry]}
    confidence: ratified
    vocabulary: {auto: 0x7, high: 0x3, medium: 0x5, mid: 0x5, low: 0x1}
    vocabulary_notes:
      - "This settles the first pass's open 3-speed vs 4-speed question: mid and medium
         are the SAME value, 0x5. The first pass's guess that 3-speed files reuse low's
         slot is not what the corpus shows."
      - "dry mode pins the field to 0x1 regardless of the labelled fan speed
         (1440.json, 68 cells), hence fan: forced in mode_traits."
    agreement:
      pass: 1552
      checked: 1669
      rate: "92.99% (dry excluded as forced)"
      files_at_100: "6/7"
      disagreeing_files:
        - "1580.json (Chigo): the field reads 0x7 for every fan label, so this capture
           set encodes no fan speed at all. 117 cells, whole file."

  - name: swing
    frame: 0
    byte: 6
    bits: "mask:0x38"
    encoding: "3-bit enum at bits 3-5. NOT a pair of independent axis flags."
    encoding_ref:
      name: enum_nibble
      params:
        vocabulary: {stop: 0x4, hSwing: 0x5, vSwing: 0x6, swing: 0x3}
    confidence: provisional
    vocabulary: {stop: 0x4, hSwing: 0x5, vSwing: 0x6, swing: 0x3}
    vocabulary_notes:
      - "The first pass reported that the combined value is not the OR of the two axis
         values and left it as raw observed bytes. It is a 3-bit enum: bit 3 is the
         horizontal axis, bit 4 the vertical, and bit 5 is set unless BOTH axes swing.
         That is why OR does not reproduce the combined case."
      - "Files that declare no swing dimension sit at a constant value: 0x4 in
         1581/2300, 0x5 in 1440/2760, 0x3 in 1580."
    agreement:
      pass: 530
      checked: 544
      rate: "97.43%"
      files_at_100: "0/1"
      disagreeing_files:
        - "2940.json (SAGA-A-22(CH)): 14 of 136 'swing' cells read 0x7 instead of 0x3.
           Only file in the family that declares swingModes, so there is nothing to
           cross-check against."

  - name: power
    frame: 0
    byte: 6
    bits: "bit:6"
    encoding: "1 = the command switches the unit off; 0 = a normal state command."
    encoding_ref:
      name: bitflag
      params: {true_values: ["off"]}
    confidence: ratified
    vocabulary: {on: 0x0, off: 0x1}
    agreement:
      pass: 1755
      checked: 1755
      rate: "100.00%"
      files_at_100: "7/7"
      disagreeing_files: []

synthesis:
  template: [[0xFF, 0x00, 0xFF, 0x00, 0xBF, 0x40, 0x80, 0x7F, 0x08, 0xF7, 0x54, 0xAB]]
  fixture_coordinates:
    mode: [cool, heat, dry]
    fan: [auto, low, medium, high]
    swing: [stop, hSwing]
    temp: [16, 18, 22, 25, 30]

derivation:
  files_used:
    - {repo: smartHomeHub, file: 1440.json, manufacturer: Akai, models: ["Unknown"]}
    - {repo: smartHomeHub, file: 1580.json, manufacturer: Chigo, models: ["Unknown"]}
    - {repo: smartHomeHub, file: 1581.json, manufacturer: Chigo, models: ["ZH/TY-01"]}
    - {repo: smartHomeHub, file: 1623.json, manufacturer: Tornado, models: ["Inverter VRF"]}
    - {repo: smartHomeHub, file: 2300.json, manufacturer: Zanussi, models: ["ZH/TT-02"]}
    - {repo: smartHomeHub, file: 2760.json, manufacturer: Tristar, models: ["AC-5400"]}
    - {repo: smartHomeHub, file: 2940.json, manufacturer: SAGA, models: ["SAGA-A-22(CH)"]}
  external_sources:
    - "WigShop hair-fitting-brief.md case two, consulted as hypothesis by the first
       pass. This pass re-derived every field from the corpus; temperature and the
       complement rule reproduce that reference exactly."
  open_questions:
    - "fan_only and heat_cool mode values disagree between files (see the mode field).
       A physical ZH-family remote would settle which file is mislabelled; the corpus
       alone cannot."
    - "1581.json's heat_cool column is shifted one degree from T=23 up. Whether that is
       a SmartIR authoring error or a real remote quirk was not chased."
    - "Byte 4 bits 5-7 carry a per-model pattern that correlates with mode and with the
       T=16 boundary but does not agree across files (1440.json holds 0xFF throughout,
       1581.json moves between 0x3F/0xBF/0x5F). Not ratified, not guessed at."
  notes:
    - "1582.json (Chigo ZH/TT-14) and 1625.json (Tornado Inverter VRF BOX), which the
       first pass flagged as resisting decode inside this family, are NOT this protocol.
       They are a distinct 96-bit layout with no complement structure and are now mapped
       separately as CHIGO96B. See the round-two report."
