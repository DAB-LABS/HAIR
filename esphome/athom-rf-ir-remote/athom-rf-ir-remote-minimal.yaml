# ============================================================================
# HAIR ESPHome Config
# ----------------------------------------------------------------------------
# Device:            Athom RF IR Remote (ESP32, RF433 + IR)
# Hardware revision: v3.0.1
# Variant:           minimal
# Contributor:       DAB-LABS
# Source:            https://github.com/athom-tech/esp32-configs
# License:           Apache 2.0
# Tested against:
#   HAIR:            0.2.0
#   HA Core:         2026.5.2
#   ESPHome:         2026.9.1
# Last verified:     2026-10-03
# Purpose:           RX+TX
# Hardware purchase: https://www.athom.tech/
# GPIO map:
#   GPIO25           IR TX (remote_transmitter)
#   GPIO33           IR RX (remote_receiver, inverted)
#   GPIO18           RF TX (433 MHz, not configured here)
#   GPIO19           RF RX (433 MHz, not configured here)
#   GPIO27           Status LED (not configured here)
#   GPIO0            Button (not configured here)
# Notes:
#   - Smallest config that gets IR TX + RX working with HAIR on the Athom
#     RF IR Remote. It stands alone: nothing is pulled from Athom's package.
#     The board settings, pins and ids come from Athom's
#     athom-rf-ir-remote.yaml, so the HA entities keep the names the
#     package gave them.
#   - RF 433 MHz, BLE proxy, climate IR, status LED and button are not
#     configured. For those, see athom-rf-ir-remote-full.yaml.
#   - Checked with `esphome config` on ESPHome 2026.9.1 on 2026-10-03.
#     The HAIR and HA Core lines above record the last hardware run.
# ============================================================================

# --- Substitutions ---
# Change these to match your device. The name must match what is set in
# your ESPHome dashboard for OTA to work.
substitutions:
  name: athom-rf-ir-remote-350628
  friendly_name: Athom RF IR Remote 1

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32dev
  variant: esp32
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# --- IR Transmitter (TX) ---
remote_transmitter:
  id: ir_transmitter
  pin: GPIO25
  carrier_duty_percent: 50%
  non_blocking: true

# --- IR Receiver (RX) ---
# Registered with HA through the infrared: platform below.
# Why these numbers, and the alternatives: https://github.com/DAB-LABS/HAIR/blob/main/docs/receiver-timing.md
remote_receiver:
  id: ir_receiver
  pin:
    number: GPIO33
    inverted: true          # most receiver modules idle high; flip this if nothing ever decodes
  clock_resolution: 400000  # 2.5us ticks; exact conversion, and it keeps the RMT divider legal on every ESP32
  idle: 80ms                # silence that ends a capture; clears every air-conditioner gap we know (Daikin ~35ms); 81.9ms is the cap on C3/S3
  receive_symbols: 384      # room for the longest press HAIR reads (Daikin 152, 293 pairs); ESPHome's default 192 cuts it
  rmt_symbols: 384          # original ESP32 only: the capture ends when this RMT memory is full; 6 of the 8 shared blocks of 64
  tolerance: 25%
  dump: all                 # chatty; remove once things work

# --- HA Native Infrared Platform ---
# These entries register the device as an infrared entity in HA, so HAIR
# can discover it as an emitter and receiver automatically.
infrared:
  - platform: ir_rf_proxy
    name: IR Proxy Transmitter
    id: ir_proxy_transmitter
    remote_transmitter_id: ir_transmitter
  - platform: ir_rf_proxy
    name: IR Proxy Receiver
    id: ir_proxy_receiver
    receiver_frequency: 38kHz
    remote_receiver_id: ir_receiver
