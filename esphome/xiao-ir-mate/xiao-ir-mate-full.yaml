# ============================================================================
# HAIR ESPHome Config
# ----------------------------------------------------------------------------
# Device:            Seeed Studio XIAO Smart IR Mate (ESP32-C3 based)
# Hardware revision: v1.0
# Variant:           full
# Contributor:       @Didgeridrew (HA Community Forum)
# Source:            https://community.home-assistant.io/t/1010610/12
# License:           Apache 2.0
# Tested against:
#   HAIR:            0.1.2
#   HA Core:         2026.5.2
#   ESPHome:         2026.9.1
# Last verified:     2026-10-20
# Purpose:           RX+TX
# Hardware purchase: https://www.seeedstudio.com/Seeed-XIAO-Smart-IR-Mate.html
# GPIO map:
#   GPIO3            IR TX (remote_transmitter)
#   GPIO4            IR RX (remote_receiver, inverted)
#   GPIO5            Touch sensor (D3, input pull-down)
#   GPIO6            Vibration motor (D4, output)
#   GPIO7            RGB LED WS2812 (D5)
# Notes:
#   - Full config preserving all XIAO IR Mate hardware features: touch
#     sensor with a haptic pulse, RGB LED for WiFi status, vibration motor.
#   - The RGB LED stays dark while WiFi is up and blinks dim red while it
#     is down. It is internal (hidden from Home Assistant); read the
#     README's note on areas before exposing it.
#   - Blended from esphome/infrared-proxies official config and Seeed
#     Studio's stock XIAO features. Integration work by @Didgeridrew.
#   - Uses the same secrets.yaml entries as the minimal variant (see README).
#   - For a stripped-down version with just IR, see xiao-ir-mate-minimal.yaml.
#   - Needs ESPHome 2026.8.0 or later. The LED is set with `channel_colors`,
#     which replaced `rgb_order` in that release, and `min_version` enforces it.
#   - Checked with `esphome config` on ESPHome 2026.9.1 on 2026-10-20.
#     The HAIR and HA Core lines above record the last hardware run.
# ============================================================================

substitutions:
  name: ir-mate
  friendly_name: IR Mate

esphome:
  name: ${name}
  name_add_mac_suffix: true
  friendly_name: ${friendly_name}
  min_version: 2026.8.0

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - globals.set:
        id: is_wifi_connected
        value: 'true'
    - light.turn_off: rgb_light
  on_disconnect:
    - globals.set:
        id: is_wifi_connected
        value: 'false'
    - light.turn_on:
        id: rgb_light
        red: 100%
        green: 0%
        blue: 0%
        brightness: 15%
        effect: Slow Blink
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

network:
  enable_ipv6: true

# --- Globals ---
globals:
  - id: is_wifi_connected
    type: bool
    initial_value: 'false'

# --- System Buttons ---
button:
  - platform: factory_reset
    id: factory_reset_button
    name: "Factory Reset"
    entity_category: diagnostic
    internal: true
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: config
    disabled_by_default: true
    icon: "mdi:restart"

# --- Touch Sensor Event ---
# The XIAO IR Mate has a capacitive touch pad on GPIO5 (D3). This exposes
# it as an HA event entity so you can use touch events in automations.
event:
  - platform: template
    name: Momentary Touch
    id: touch_sensor
    event_types:
      - single
    device_class: "button"
    on_event:
      then:
        - lambda: |-
            ESP_LOGD("main", "Event %s triggered.", event_type.c_str());

# --- IR Transmitter (TX) ---
remote_transmitter:
  id: ir_tx
  pin: GPIO3
  carrier_duty_percent: 50%
  non_blocking: true

# --- IR Receiver (RX) ---
# Registered with HA through the infrared: platform below.
# Why these numbers, and the alternatives: https://github.com/DAB-LABS/HAIR/blob/main/docs/receiver-timing.md
remote_receiver:
  id: ir_rx
  pin:
    number: GPIO4
    inverted: true          # most receiver modules idle high; flip this if nothing ever decodes
  clock_resolution: 400000  # 2.5us ticks; exact conversion, and it keeps the RMT divider legal on every ESP32
  idle: 80ms                # silence that ends a capture; clears every air-conditioner gap we know (Daikin ~35ms); 81.9ms is the cap on C3/S3
  receive_symbols: 384      # room for the longest press HAIR reads (Daikin 152, 293 pairs); ESPHome's default 192 cuts it; ~1.5 KB of RAM
                            # leave rmt_symbols at its default on this chip: it does not limit how long a capture can be
  tolerance: 25%
  dump: all                 # chatty; remove once things work

# --- HA Native Infrared Platform ---
# These entries register the device as an infrared entity in HA, so HAIR
# can discover it as an emitter and receiver automatically.
infrared:
  - platform: ir_rf_proxy
    name: Proxy Tx
    id: ir_proxy_tx
    remote_transmitter_id: ir_tx
  - platform: ir_rf_proxy
    name: Proxy Rx
    id: ir_proxy_rx
    remote_receiver_id: ir_rx

# --- Touch Pad (GPIO5 / D3) ---
# Capacitive touch sensor. Each touch gives one vibration pulse and one
# event on the touch_sensor event entity above. Releasing the pad does
# nothing.
binary_sensor:
  - platform: gpio
    id: touch_pad
    pin:
      number: GPIO5
      mode: INPUT_PULLDOWN
    on_press:
      then:
        - script.execute:
            id: vibe
            delay_ms: 100
        - event.trigger:
            id: touch_sensor
            event_type: "single"

# --- Vibration Motor (GPIO6 / D4) ---
# Haptic feedback motor. The vibe script pulses it for a configurable
# duration in milliseconds; a new pulse restarts one already running.
output:
  - platform: gpio
    id: vibration_output
    pin: GPIO6

script:
  - id: vibe
    mode: restart
    parameters:
      delay_ms: int
    then:
      - switch.turn_on: vibration_switch
      - delay: !lambda return delay_ms;
      - switch.turn_off: vibration_switch

switch:
  - platform: output
    id: vibration_switch
    name: "Vibration device"
    output: vibration_output
    internal: true

# --- RGB LED (GPIO7 / D5) ---
# WS2812 status LED. Dark while WiFi is up; a dim red blink (on 0.5s,
# off 2.5s) while it is down. It starts off at boot.
light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    pin: GPIO7
    num_leds: 1
    chipset: WS2812
    name: "RGB Light"
    id: rgb_light
    rmt_symbols: 48
    internal: true          # hidden from Home Assistant; remove this line to control the LED from HA (see the README on areas)
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    effects:
      - strobe:
          name: Slow Blink
          colors:
            - state: true
              red: 100%
              green: 0%
              blue: 0%
              brightness: 15%
              duration: 500ms
            - state: false
              duration: 2500ms
