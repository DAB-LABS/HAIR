# ============================================================================
# HAIR ESPHome Config
# ----------------------------------------------------------------------------
# Device:            KinCony KC868-AGv3 Smart IR RF Controller
#                    (ESP32-S3-WROOM-1U N16R8)
# Hardware revision: KINCONY-AGV3-V10
# Variant:           minimal
# Contributor:       DAB-LABS
# Source:            KinCony pin definition:
#                    https://www.kincony.com/forum/showthread.php?tid=9468
#                    Working receiver pin settings from Simon Says Home
#                    Assistant: https://www.youtube.com/watch?v=LqFLHZzLR54
# License:           Apache 2.0
# Tested against:
#   HAIR:            not yet run on hardware
#   HA Core:         not yet run on hardware
#   ESPHome:         2026.9.1
# Last verified:     2026-10-04
# Purpose:           RX+TX
# Hardware purchase: https://www.kincony.com/esp32s3-smart-ir-rf-controller.html
# GPIO map:
#   GPIO47           IR TX (remote_transmitter, the 7 IR tubes inside the box)
#   GPIO1            IR RX (remote_receiver, inverted, pull-up)
#   GPIO43           IR extension cable port 1 (commented out below)
#   GPIO44           IR extension cable port 2 (commented out below)
#   GPIO2            RF433 TX (not configured here)
#   GPIO9            RF433 RX (not configured here)
#   GPIO21           Buzzer (not configured here)
#   GPIO11 / GPIO10  I2C SDA / SCL (not configured here)
# Notes:
#   - Smallest config that gets IR TX + RX working with HAIR on the
#     KC868-AGv3. RF, buzzer and I2C are present on the board but not
#     configured.
#   - PSRAM is left out on purpose: IR does not need it, and a wrong PSRAM
#     mode stops the board booting.
#   - Checked with `esphome config` on ESPHome 2026.9.1 on 2026-10-04.
#     Hardware verification pending.
# ============================================================================

substitutions:
  name: kincony-agv3
  friendly_name: KinCony AGv3

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

# On the S3 the logger defaults to the USB port (USB_SERIAL_JTAG), which
# keeps GPIO43/GPIO44 free for the IR extension ports below.
logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# --- IR Transmitter (TX) ---
# The 7 IR tubes inside the box.
remote_transmitter:
  - id: ir_tx
    pin: GPIO47
    carrier_duty_percent: 50%
    non_blocking: true

  # IR extension cable ports. To use them, uncomment these two and the
  # matching infrared: entries below. GPIO43 and GPIO44 are the S3's UART0
  # pins, so the logger must not be moved to UART0 while they are in use.
  # - id: ir_tx_ext1
  #   pin: GPIO43
  #   carrier_duty_percent: 50%
  #   non_blocking: true
  # - id: ir_tx_ext2
  #   pin: GPIO44
  #   carrier_duty_percent: 50%
  #   non_blocking: true

# --- IR Receiver (RX) ---
# Registered with HA through the infrared: platform below.
# Why these numbers, and the alternatives: https://github.com/DAB-LABS/HAIR/blob/main/docs/receiver-timing.md
remote_receiver:
  id: ir_rx
  pin:
    number: GPIO1
    inverted: true          # most receiver modules idle high; flip this if nothing ever decodes
    mode:
      input: true
      pullup: true
  clock_resolution: 400000  # 2.5us ticks; exact conversion, and it keeps the RMT divider legal on every ESP32
  idle: 80ms                # silence that ends a capture; clears every air-conditioner gap we know (Daikin ~35ms); 81.9ms is the cap on C3/S3
  receive_symbols: 384      # room for the longest press HAIR reads (Daikin 152, 293 pairs); ESPHome's default 192 cuts it; ~1.5 KB of RAM
                            # leave rmt_symbols at its default on this chip: it does not limit how long a capture can be
  tolerance: 25%
  dump: all                 # chatty; remove once things work

# --- HA Native Infrared Platform ---
# These entries register the device as an infrared entity in HA, so HAIR
# can discover it as an emitter and receiver automatically.
infrared:
  - platform: ir_rf_proxy
    name: ${friendly_name} TX
    id: ir_proxy_tx
    remote_transmitter_id: ir_tx
  - platform: ir_rf_proxy
    name: ${friendly_name} RX
    id: ir_proxy_rx
    receiver_frequency: 38kHz
    remote_receiver_id: ir_rx
  # Extension ports, if enabled above:
  # - platform: ir_rf_proxy
  #   name: ${friendly_name} TX ext 1
  #   id: ir_proxy_tx_ext1
  #   remote_transmitter_id: ir_tx_ext1
  # - platform: ir_rf_proxy
  #   name: ${friendly_name} TX ext 2
  #   id: ir_proxy_tx_ext2
  #   remote_transmitter_id: ir_tx_ext2
