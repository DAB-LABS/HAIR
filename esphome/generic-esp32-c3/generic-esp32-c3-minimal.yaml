# ============================================================================
# HAIR ESPHome Config
# ----------------------------------------------------------------------------
# Device:            Generic ESP32-C3 dev kit (Espressif ESP32-C3-DevKitM-1
#                    or compatible)
# Hardware revision: Any
# Variant:           minimal
# Contributor:       DAB-LABS
# Source:            in-house
# License:           Apache 2.0
# Tested against:
#   HAIR:            0.1.2
#   HA Core:         2026.5.2
#   ESPHome:         2026.9.1
# Last verified:     2026-10-03
# Purpose:           RX+TX
# Hardware purchase: DIY
# GPIO map:
#   GPIO9            IR TX (remote_transmitter)
#   GPIO8            IR RX (remote_receiver, inverted, pull-up)
# Notes:
#   - Smallest config that gets IR TX + RX working with HAIR on an ESP32-C3.
#   - Uses esp-idf framework. If you need Arduino framework, change the
#     framework type and adjust pin configuration accordingly.
#   - Checked with `esphome config` on ESPHome 2026.9.1 on 2026-10-03.
#     The HAIR and HA Core lines above record the last hardware run.
# ============================================================================

substitutions:
  name: hair-c3
  friendly_name: HAIR C3

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# --- IR Transmitter (TX) ---
remote_transmitter:
  id: ir_tx
  pin: GPIO9
  carrier_duty_percent: 50%
  non_blocking: true

# --- IR Receiver (RX) ---
# Registered with HA through the infrared: platform below.
# Why these numbers, and the alternatives: https://github.com/DAB-LABS/HAIR/blob/main/docs/receiver-timing.md
remote_receiver:
  id: ir_rx
  pin:
    number: GPIO8
    inverted: true          # most receiver modules idle high; flip this if nothing ever decodes
    mode:
      input: true
      pullup: true
  clock_resolution: 400000  # 2.5us ticks; exact conversion, and it keeps the RMT divider legal on every ESP32
  idle: 80ms                # silence that ends a capture; clears every air-conditioner gap we know (Daikin ~35ms); 82ms is the cap on C3/S3
  receive_symbols: 384      # room for the longest press HAIR reads (Daikin 152, 293 pairs); ESPHome's default 192 cuts it; ~1.5 KB of RAM
                            # leave rmt_symbols at its default on this chip: it does not limit how long a capture can be
  tolerance: 25%
  dump: all                 # chatty; remove once things work

# --- HA Native Infrared Platform ---
# These entries register the device as an infrared entity in HA, so HAIR
# can discover it as an emitter and receiver automatically.
infrared:
  - platform: ir_rf_proxy
    name: ${friendly_name} TX
    id: ir_proxy_tx
    remote_transmitter_id: ir_tx
  - platform: ir_rf_proxy
    name: ${friendly_name} RX
    id: ir_proxy_rx
    receiver_frequency: 38kHz
    remote_receiver_id: ir_rx
